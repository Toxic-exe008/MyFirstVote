<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFirstVote — Know Your Candidate, Mumbai 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP NAV -->
  <nav class="top-nav">
    <div class="top-nav-inner">
      <span class="nav-logo">My<span>First</span>Vote</span>
      <a href="index.html" class="nav-link active">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a href="parties.html" class="nav-link">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l8-4 8 4v14M9 21V11h6v10"/></svg>
        <span>Parties</span>
      </a>
      <a href="voters-guide.html" class="nav-link">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        <span>Voter's Guide</span>
      </a>
    </div>
  </nav>

  <!-- MARQUEE — populated from DB by script.js -->
  <div class="marquee-bar" id="marqueeBar" style="display:none">
    <marquee id="marqueeText" behavior="scroll" direction="left" scrollamount="5"></marquee>
  </div>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="header-top"><span class="header-badge">Mumbai 2026</span></div>
      <h1>My<span>First</span>Vote</h1>
      <p class="header-subtitle">Transparent profiles for every candidate &mdash; assets, criminal cases &amp; background in one place</p>
      <div class="controls">
        <div class="search-wrap">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search" placeholder="Search by name, party&hellip;" autocomplete="off" />
        </div>
        <select id="filter">
          <option value="">All Constituencies</option>
          <option value="Kurla">Kurla</option>
          <option value="Chembur">Chembur</option>
          <option value="Andheri East">Andheri East</option>
          <option value="Bandra West">Bandra West</option>
        </select>
      </div>
    </div>
  </header>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stats-inner">
      <div class="stat-item"><div class="stat-dot"></div><span><strong>4</strong> Constituencies</span></div>
      <div class="stat-item"><div class="stat-dot" style="background:#38a169"></div><span>Data from ECI &amp; ADR via MyNeta</span></div>
      <div id="resultsCount"></div>
    </div>
  </div>

  <!-- CANDIDATE GRID -->
  <main id="candidatesContainer"></main>

  <footer>
    &copy; 2026 MyFirstVote &mdash; Data from public ECI affidavits &nbsp;|&nbsp;
    <a href="voters-guide.html">Voter's Guide</a> &nbsp;|&nbsp;
    <a href="parties.html">Parties</a> &nbsp;|&nbsp;
    <a href="admin.html" style="opacity:.35">Admin</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
